spring.application.name=JavaPro_Kafka
spring.kafka.bootstrap-servers=localhost:19092,localhost:19094,localhost:19096
spring.kafka.template.default-topic=javapro-kafka
spring.kafka.consumer.group-id=javapro-kafka
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.StringOrBytesSerializer
spring.kafka.consumer.properties.spring.json.trusted.packages=org.arcsoft.javapro_kafka
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.trusted.packages=org.arcsoft.javapro_kafka
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/javapro
spring.datasource.username=javapro
spring.datasource.password=javapro
spring.datasource.hikari.minimum-idle=50
spring.datasource.hikari.maximum-pool-size=100
spring.jpa.properties.hibernate.jdbc.batch_size=5000
spring.jpa.properties.hibernate.order_inserts=true
spring.threads.virtual.enabled=true
server.port=8888